<svg xmlns="http://w3.org" viewBox="0 0 64 64" width="64" height="64">
    <!-- 1. Analog dB Master Scale Text Matrix (Left Column Alignment) -->
    <!-- Using generic styling tokens to respect standard system engine anti-aliasing -->
    <text x="2" y="10" font-family="monospace" font-size="7" font-weight="bold" fill="currentColor">+12</text>
    <line x1="16" y1="8" x2="22" y2="8" stroke="currentColor" stroke-width="1.5" />

    <text x="10" y="26" font-family="monospace" font-size="7" font-weight="bold" fill="currentColor">0</text>
    <line x1="16" y1="24" x2="24" y2="24" stroke="currentColor" stroke-width="2" /> <!-- Unity gain reference track -->

    <text x="4" y="44" font-family="monospace" font-size="7" font-weight="bold" fill="currentColor">-12</text>
    <line x1="16" y1="42" x2="22" y2="42" stroke="currentColor" stroke-width="1.5" />

    <text x="8" y="58" font-family="monospace" font-size="7" font-weight="bold" fill="currentColor">-∞</text>
    <line x1="16" y1="56" x2="22" y2="56" stroke="currentColor" stroke-width="1.5" />

    <!-- Intermediate ticks for continuous linear calibration layout -->
    <line x1="18" y1="14" x2="22" y2="14" stroke="currentColor" stroke-width="1" opacity="0.6" />
    <line x1="18" y1="33" x2="22" y2="33" stroke="currentColor" stroke-width="1" opacity="0.6" />
    <line x1="18" y1="49" x2="22" y2="49" stroke="currentColor" stroke-width="1" opacity="0.6" />

    <!-- 2. Vertical Fader Path Rail Track -->
    <rect x="44" y="4" width="2" height="56" fill="currentColor" opacity="0.25" />

    <!-- 3. Authentic Ergonomic Hardware Fader Knob (Wedge layout) -->
    <!-- Positioned relative to the 64x64 coordinate layer space -->
    <path d="M 32,16
          H 58
          Q 54,20 58,24
          Q 54,28 58,31
          H 32
          Q 36,28 32,24
          Q 36,20 32,16 Z"
          fill="currentColor" />

    <!-- Physical validation indicator bar lines inside the hardware knob track -->
    <line x1="32" y1="24" x2="58" y2="24" stroke="black" stroke-width="1.5" />
</svg>
