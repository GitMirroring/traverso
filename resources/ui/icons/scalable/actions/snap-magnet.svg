<svg xmlns="http://w3.org" viewBox="0 0 48 48" width="100%" height="100%">
    <defs>
        <!--
        Standardized profile classes recognized by the Qt6 SVG compiler engine.
        The fallbacks are configured to match Traverso's original branding palette.
        -->
        <style id="current-color-scheme" type="text/css">
            .ColorScheme-Text { color: #FFCC00; }
            .ColorScheme-Highlight { color: #FF3300; }
        </style>

        <!--
        The master gradient engine mapping 'currentColor' directly to the specific
        XML values extracted from TThemer and pushed through the active toolbar context.
        -->
        <linearGradient id="snapGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="currentColor" class="ColorScheme-Text" />
            <stop offset="100%" stop-color="currentColor" class="ColorScheme-Highlight" />
        </linearGradient>
    </defs>

    <!-- All high-detail graphical elements bound flawlessly to the dynamic asset gradient -->
    <g id="magnet-high-detail-layers">
        <!-- Core magnet path -->
        <path d="M 12,12 L 12,26 C 12,38 36,38 36,26 L 36,12 L 28,12 L 28,26 C 28,30 20,30 20,26 L 20,12 Z" fill="url(#snapGrad)" />
        <rect x="12" y="8" width="8" height="4" fill="url(#snapGrad)" />
        <rect x="28" y="8" width="8" height="4" fill="url(#snapGrad)" />

        <!-- Concentric magnetic field / alignment arcs -->
        <g stroke="url(#snapGrad)" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.75">
            <path d="M 9,31 C 9,44 39,44 39,31" />
            <path d="M 5,35 C 5,49 43,49 43,35" />
        </g>
    </g>
</svg>
