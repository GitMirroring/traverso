<svg xmlns="http://w3.org" viewBox="0 0 24 24" width="24" height="24">
    <!-- Hoofdbehuizing van de Audio Interface -->
    <rect x="2" y="5" width="20" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Rackmount 'oren' / montagegaten (optioneel, geeft echt een audio-look) -->
    <line x1="2" y1="8" x2="2" y2="16" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>
    <line x1="22" y1="8" x2="22" y2="16" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>

    <!-- Draaiknoppen (Gain / Volume Potentiometers) -->
    <!-- Knop 1 -->
    <circle cx="6" cy="12" r="2.5" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <line x1="6" y1="12" x2="6" y2="10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Knop 2 -->
    <circle cx="12" cy="12" r="2.5" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <line x1="12" y1="12" x2="13.5" y2="10.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Audio Ingangen (6.3mm Jack / Combo inputs) -->
    <circle cx="18" cy="10" r="1.5" fill="currentColor"/>
    <circle cx="18" cy="15" r="1.5" fill="currentColor"/>

    <!-- Status & Clip LED indicatoren (Behouden hun functionele kleur in elk thema) -->
    <!-- Power / Signal LED (Groen) -->
    <circle cx="5" cy="7" r="0.75" fill="#00FF00"/>

    <!-- Clip LED (Rood) -->
    <circle cx="11" cy="7" r="0.75" fill="#FF0000"/>
</svg>
